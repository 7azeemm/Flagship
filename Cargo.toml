[package]
name = "Flagship"
version = "0.1.0"
edition = "2024"
default-run = "Flagship"

[lib]
name = "flagship"

[[bin]]
name = "scan-benchmark"
path = "tools/scan_benchmark.rs"

[profile.release]
opt-level = 3
lto = false
codegen-units = 16

[lints.clippy]
disallowed_types = "deny"

[dependencies]
tokio = { version = "1.51.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
reqwest = { version = "0.13.2", features = ["json", "form", "gzip", "brotli", "deflate", "zstd", "socks"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
indexmap = { version = "2.14.0", features = ["serde"] }
axum = "0.8.8"
scraper = "0.27.0"
futures = "0.3.32"
regex = "1.12.3"
chrono = { version = "0.4.44", features = ["serde"] }
dotenvy = "0.15.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.18"
async-trait = "0.1.89"
playwright-rs = { version = "0.19.0" }
humantime-serde = "1.1.1"
strum = "0.28.0"
strum_macros = "0.28.0"
tower-http = { version = "0.7.0", features = ["compression-br", "compression-gzip"] }
axum-extra = { version = "0.12.6", features = ["query"] }
rand = "0.10.1"
serenity = { version = "0.12.4", default-features = false, features = ["builder", "cache", "client", "gateway", "http", "model", "rustls_backend"] }
uuid = { version = "1.24.1", features = ["v4", "serde"] }
urlencoding = "2.1.3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros", "json", "chrono"] }
argon2 = { version = "0.5" }
sha2 = "0.11.0"
base64 = "0.23.1"
email_address = "0.2"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
